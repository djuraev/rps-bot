# This file runs inside the FRONTEND container (nginx).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1) the web page itself (HTML, CSS, JavaScript)
    location / {
        add_header Cache-Control "no-cache" always;   # always show the newest version while you edit
        try_files $uri $uri/ /index.html;
    }

    # 2) everything under /api/ is forwarded to the backend container.
    #    "backend" is the SERVICE NAME from compose.yaml: Docker's built-in DNS
    #    (127.0.0.11) turns it into the container's address.
    #    Using a variable makes nginx look the name up again on every request,
    #    so a backend that restarted (new address) is found automatically.
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_url http://backend:3000;
        proxy_pass $backend_url;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # backend stopped or unreachable? answer with a clear message
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"backend is not reachable"}';
    }
}
